<p>jobs-crud works!</p>

<div class="jobs-crud mx-auto mt-8 max-w-3xl bg-neutral-300 p-8">
  <h2 class="text-2xl font-bold mb-4">Cargar Trabajo</h2>
  <select
    [ngModel]="selectedJobId"
    (change)="loadJob($event)"
    class="mt-1 block w-full border-gray-300 rounded-md shadow-sm">
    <option value="">Selecciona un trabajo</option>
    @for (job of jobs$ | async; track job.jobId) {
      <option [value]="job.jobId">{{ job.name }}</option>
    }
  </select>

  <h3 class="text-xl font-semibold mt-6 mb-4">{{ editingJobId ? 'Editar Trabajo' : 'Crear Nuevo Trabajo' }}</h3>
  <form (ngSubmit)="saveJob()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700">Nombre del Trabajo:</label>
      <input
        class="mt-1 block w-full border-gray-300 rounded-md shadow-sm"
        type="text"
        [(ngModel)]="newJob.name"
        name="jobName"
        required
      >
      @if (errorMessage) {
        <p class="text-red-500 text-sm mt-1">{{ errorMessage }}</p>
      }
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700">Descripción:</label>
      <textarea
        class="mt-1 block w-full border-gray-300 rounded-md shadow-sm"
        [(ngModel)]="newJob.description"
        name="jobDescription"
        rows="4"
        required
      ></textarea>
    </div>

    <div class="flex space-x-2">
      <button
        type="submit"
        class="bg-green-500 text-white px-4 py-2 rounded-md">
        {{ editingJobId ? 'Actualizar Trabajo' : 'Crear Trabajo' }}
      </button>
      @if (editingJobId) {
        <button
          type="button"
          (click)="resetForm()"
          class="bg-gray-500 text-white px-4 py-2 rounded-md">
          Cancelar
        </button>
        <button
          type="button"
          (click)="deleteJob()"
          class="bg-red-500 text-white px-4 py-2 rounded-md">
          Eliminar Trabajo
        </button>
      }
    </div>
  </form>
</div>
