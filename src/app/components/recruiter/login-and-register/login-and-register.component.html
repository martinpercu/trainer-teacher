<div
    class="flex flex-col w-60 px-2 h-fit text-sm text-neutral-700 dark:text-neutral-200 bg-white dark:bg-neutral-750 rounded-xl border border-gray-200 dark:border-neutral-700"
  >
  @if(loginOrRegister){
  <app-recruiter-login></app-recruiter-login>
  <div class="cursor-pointer hover:underline text-center pt-4 pb-3"
    (click)="toggleLoginRegister()">
    {{ "auth.no_account_create_one" | transloco}}
  </div>
  }@else {
  <app-recruiter-register></app-recruiter-register>
  <div class="cursor-pointer hover:underline text-center pt-4 pb-3"
    (click)="toggleLoginRegister()">
    {{ "auth.already_account" | transloco}}
  </div>
  }

</div>
